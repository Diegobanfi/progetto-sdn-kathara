# Lab 18: Enterprise SDN Network — Exam Playground
#
# Topology (data plane):
#   ext1 ──[F]── r1 ──[A]── s1 ──[B]── h1
#                            │
#                           [C]
#                            │
#                            s2 ──[D]── h2
#                            │
#                           [E]
#                            │
#                            h3
#
# Management plane (out-of-band):
#   controller ──[MGMT]── s1, s2

# --- Ryu Controller ---
# Uses the custom asdn/sdn image (has Ryu installed).
# Build it once with: docker build -t asdn/sdn -f ../docker/Dockerfile.sdn ../docker/
controller[image]="asdn/sdn"
controller[0]="MGMT"

# --- Gateway Router ---
r1[0]="F"
r1[1]="A"

# --- Core SDN Switch ---
s1[image]="kathara/sdn"
s1[0]="A" #verso r1
s1[1]="B" #verso h1
s1[2]="C" #verso s2
s1[4]="G" #verso s3
s1[3]="MGMT" #vero MGMT

# --- Access SDN Switch ---
s2[image]="kathara/sdn"
s2[0]="C"
s2[1]="D"
s2[2]="E"
s2[4]="H" #verso s3
s2[3]="MGMT"

#--- New SDN Switch (s3) ---
s3[image]="kathara/sdn"
s3[0]="G"      # Verso s1 (eth0)
s3[1]="H"      # Verso s2 (eth1)
s3[2]="MGMT"   # Management (eth2)
# --- Internal Hosts ---
h1[0]="B"
h2[0]="D"
h3[0]="E"

# --- External Client ---
ext1[0]="F"
