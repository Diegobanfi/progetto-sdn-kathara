# Lab 18: Enterprise SDN Network - ring topology with policy routing
#
# Topology (data plane):
#
#   ext1 --[F]-- r1 --[A]-- s1 --[B]-- h1
#                           |  \
#                          [C]  [G]
#                           |     \
#                           s2 -[H]- s3
#                          /  \
#                       [D]    [E]
#                        |      |
#                        h2     h3
#
#   Ring: s1 -[C]- s2 -[H]- s3 -[G]- s1
#
# Management plane (out-of-band):
#   controller --[MGMT]-- s1, s2, s3

# --- Ryu Controller ---
# Uses the custom asdn/sdn image (Ryu installed). Build it once from the
# repository root with:
#   docker build -t asdn/sdn -f docker/Dockerfile.sdn docker/
controller[image]="asdn/sdn"
controller[0]="MGMT"

# --- Gateway Router ---
r1[0]="F"
r1[1]="A"

# --- Core SDN Switch (s1) ---
# OpenFlow ports follow the order of `ovs-vsctl add-port` in s1.startup.
s1[image]="kathara/sdn"
s1[0]="A"       # to r1       (OF port 1)
s1[1]="B"       # to h1       (OF port 2)
s1[2]="C"       # to s2       (OF port 3)
s1[4]="G"       # to s3       (OF port 4) - NEW
s1[3]="MGMT"    # to controller (not part of the OVS bridge)

# --- Access SDN Switch (s2) ---
s2[image]="kathara/sdn"
s2[0]="C"       # to s1       (OF port 1)
s2[1]="D"       # to h2       (OF port 2)
s2[2]="E"       # to h3       (OF port 3)
s2[4]="H"       # to s3       (OF port 4) - NEW
s2[3]="MGMT"    # to controller (not part of the OVS bridge)

# --- New SDN Switch (s3), closes the ring ---
s3[image]="kathara/sdn"
s3[0]="G"       # to s1       (OF port 1)
s3[1]="H"       # to s2       (OF port 2)
s3[2]="MGMT"    # to controller (not part of the OVS bridge)

# --- Internal Hosts ---
h1[0]="B"
h2[0]="D"
h3[0]="E"

# --- External Client ---
ext1[0]="F"
